server.port=9090

spring.application.name=culinary-guide-backend

spring.docker.compose.lifecycle-management=start-and-stop

# Promenjen port u URL-u na 3307
spring.datasource.url=jdbc:mysql://localhost:3307/culinary_guide_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=verysecret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT — tajni ključ NIJE u kodu: env varijabla JWT_SECRET ili app.jwt.secret u application-local.properties
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=culinary_guide_token
# U produkciji preko HTTPS-a: JWT_COOKIE_SECURE=true
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=Lax

# Frontend origin-i kojima je dozvoljeno slanje kolačića (zarezom odvojeni)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Rate limiting (Redis fixed-window, po IP adresi)
app.rate-limit.enabled=true
app.rate-limit.api-limit=120
app.rate-limit.auth-limit=10
app.rate-limit.window-seconds=60

# Google Places — postavi env var GOOGLE_PLACES_API_KEY (ne commitaj ključ)
# ili lokalni fajl application-local.properties (gitignored)
spring.config.import=optional:classpath:application-local.properties
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.latitude=44.7722
google.places.longitude=17.1910
google.places.radius-meters=1800
google.places.max-pages=3
google.places.max-results=200
google.places.import-reviews=true
google.places.details-max-places=20
